<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            unbounded: ['Unbounded', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #09090b; font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(24, 24, 27, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-[#09090b] text-white flex items-center justify-center p-12 relative overflow-hidden">
  <!-- Glowing orbs -->
  <div class="absolute top-[-20%] left-[-10%] w-[800px] h-[800px] bg-blue-600/30 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[800px] h-[800px] bg-purple-600/30 rounded-full blur-[120px]"></div>

  <!-- Main Container -->
  <div class="glass w-full h-full rounded-[2rem] shadow-2xl p-10 flex gap-10 z-10 relative">
    <!-- Left Side: Content -->
    <div class="flex-1 flex flex-col justify-between h-full">
      <div class="flex flex-col gap-6">
        <!-- Bot Username Badge -->
        <div class="flex items-center gap-2 w-fit px-4 py-2 rounded-full bg-white/5 border border-white/10">
          <svg class="w-6 h-6 text-[#2AABEE]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span class="text-white/90 font-semibold text-xl" id="og-bot">via @FavorDealsBot</span>
        </div>

        <!-- Title -->
        <h1 class="font-unbounded text-5xl font-bold leading-[1.3] text-white tracking-tight" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;" id="og-title">
          Contract Title
        </h1>
        
        <!-- Description Preview -->
        <p class="text-2xl text-zinc-400 leading-relaxed font-medium mt-2" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;" id="og-description">
          Short contract description
        </p>
      </div>

      <div class="flex flex-col gap-6">
        <!-- Badges -->
        <div class="flex flex-wrap gap-4">
          <div class="flex items-center gap-3 px-5 py-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20">
            <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)]"></div>
            <span class="text-emerald-100 font-semibold text-xl" id="og-category">Category</span>
          </div>
          
          <div class="flex items-center gap-3 px-5 py-3 rounded-2xl bg-blue-500/10 border border-blue-500/20">
            <div class="w-3 h-3 rounded-full bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.8)]"></div>
            <span class="text-blue-100 font-semibold text-xl" id="og-budget">Budget</span>
          </div>

          <div class="flex items-center gap-3 px-5 py-3 rounded-2xl bg-purple-500/10 border border-purple-500/20">
            <div class="w-3 h-3 rounded-full bg-purple-400 shadow-[0_0_10px_rgba(192,132,252,0.8)]"></div>
            <span class="text-purple-100 font-semibold text-xl" id="og-deadline">Deadline</span>
          </div>
        </div>

        <!-- Published Date -->
        <div class="flex items-center gap-2 text-zinc-500 text-xl font-medium" id="og-date">
          Published
        </div>
      </div>
    </div>

    <!-- Right Side: Image -->
    <div class="w-[450px] h-full rounded-3xl overflow-hidden border border-white/10 relative shrink-0 bg-black/40 flex items-center justify-center shadow-2xl">
      <img id="og-image-el" src="" class="w-full h-full object-cover hidden" />
      <div id="og-image-placeholder" class="w-full h-full flex items-center justify-center relative overflow-hidden" style="background-color:#07151d;background-image:radial-gradient(circle at 24% 20%,#22d3ee 0%,transparent 38%),radial-gradient(circle at 78% 31%,#2563eb 0%,transparent 42%),radial-gradient(circle at 76% 78%,#8b5cf6 0%,transparent 44%),radial-gradient(circle at 24% 74%,#34d399 0%,transparent 40%),linear-gradient(145deg,#07151d 5%,#09090b 96%)">
        <div class="absolute -right-24 -top-20 w-80 h-80 rounded-full border border-white/20 bg-white/10 backdrop-blur-2xl shadow-2xl"></div>
        <div class="absolute bottom-16 left-10 w-64 h-24 rounded-full bg-white/10 blur-2xl"></div>
        <div class="relative w-28 h-28 rounded-[2rem] border border-white/25 bg-black/20 backdrop-blur-xl flex items-center justify-center text-6xl font-unbounded font-bold text-white/90 shadow-2xl">F</div>
      </div>
    </div>
  </div>
</body>
</html>
